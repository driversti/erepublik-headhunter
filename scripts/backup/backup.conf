#!/usr/bin/env bash
# Centralized configuration for all backup scripts.
# Sourced by backup-db.sh, verify-backup.sh, disk-monitor.sh.

# ── Project root (where docker-compose.yml lives) ──────────────────────
PROJECT_DIR="/home/yurii/docker/headhunter"

# ── Database ────────────────────────────────────────────────────────────
DB_CONTAINER="headhunter-postgres"
DB_NAME="headhunter"
DB_USER="headhunter"

# ── Local paths ─────────────────────────────────────────────────────────
BACKUP_DIR="/home/yurii/backups/headhunter"
BACKUP_TEMP_DIR="${BACKUP_DIR}/temp"
BACKUP_LOG_DIR="${BACKUP_DIR}/logs"
LOCK_FILE="/var/lock/headhunter-backup.lock"

# ── NAS (TrueNAS via rsync+SSH) ────────────────────────────────────────
NAS_USER="buser"
NAS_HOST="192.168.10.81"
NAS_PATH="/mnt/Bermuda404/BACKUP/erepublik/headhunter"
NAS_SSH_KEY="/home/yurii/.ssh/nas_backup_key"
NAS_DEST="${NAS_USER}@${NAS_HOST}:${NAS_PATH}"
NAS_SSH_OPTS="-i ${NAS_SSH_KEY} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"

# ── Retention ───────────────────────────────────────────────────────────
# 6-hourly backups kept for 7 days
RETENTION_6H_DAYS=7
# Daily backups (the 00:xx run) kept for 30 days
RETENTION_DAILY_DAYS=30
# Weekly backups (Sunday) kept for 6 months (~182 days)
RETENTION_WEEKLY_DAYS=182

# ── rsync ───────────────────────────────────────────────────────────────
RSYNC_RETRIES=3
RSYNC_RETRY_DELAY=60

# ── Disk monitoring ────────────────────────────────────────────────────
DISK_THRESHOLD_PERCENT=80
DISK_ALERT_SUPPRESS_HOURS=6
DISK_ALERT_MARKER="/tmp/headhunter-disk-alert.marker"
BACKUP_STALE_HOURS=7

# ── Log rotation ────────────────────────────────────────────────────────
LOG_COMPRESS_AFTER_DAYS=1
LOG_DELETE_AFTER_DAYS=90

# ── Telegram (sourced from .env) ────────────────────────────────────────
ENV_FILE="${PROJECT_DIR}/.env"
if [[ -f "$ENV_FILE" ]]; then
    # Only import TELEGRAM_* variables (avoid polluting namespace)
    TELEGRAM_BOT_TOKEN=$(grep -E '^TELEGRAM_BOT_TOKEN=' "$ENV_FILE" | cut -d'=' -f2-)
    TELEGRAM_CHAT_ID=$(grep -E '^TELEGRAM_CHAT_ID=' "$ENV_FILE" | cut -d'=' -f2-)
fi

# Allow environment overrides
TELEGRAM_BOT_TOKEN="${TELEGRAM_BOT_TOKEN:-}"
TELEGRAM_CHAT_ID="${TELEGRAM_CHAT_ID:-}"

# ── Crontab entries (install with: crontab -e) ─────────────────────────
# 0 */6 * * * /home/yurii/docker/headhunter/scripts/backup-db.sh >> /home/yurii/backups/headhunter/logs/cron.log 2>&1
# 0 3 * * 0   /home/yurii/docker/headhunter/scripts/verify-backup.sh >> /home/yurii/backups/headhunter/logs/cron.log 2>&1
# 0 * * * *   /home/yurii/docker/headhunter/scripts/disk-monitor.sh >> /home/yurii/backups/headhunter/logs/cron.log 2>&1
